name: Generate Contribution Snake and Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: PERIYASAMY-N
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate Stats
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=PERIYASAMY-N&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true
          path: dist/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=PERIYASAMY-N&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: dist/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak
        continue-on-error: true
        uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
        with:
          USERNAME: PERIYASAMY-N
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: tokyonight
          HIDE_BORDER: true
          OUTPUT_PATH: dist/github-streak.svg

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
